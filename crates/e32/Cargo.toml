[package]
name = "e32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust API over EKA2 executive calls: debug output, exit, panic, E32Main"

[dependencies]
e32-sys.workspace = true
critical-section = { version = "1.2", optional = true }

[features]
# a `critical-section` implementation (a kernel mutex) for dependencies that need one, e.g. Slint
critical-section = ["dep:critical-section"]

# the heap behind `alloc` exists only on the Symbian target
[target.'cfg(target_arch = "arm")'.dependencies]
linked_list_allocator = { version = "=0.10.6", default-features = false }
