[package]
name = "e32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust API over EKA2 executive calls: debug output, exit, panic, E32Main"

[dependencies]
e32-sys.workspace = true

# the heap behind `alloc` exists only on the Symbian target
[target.'cfg(target_arch = "arm")'.dependencies]
linked_list_allocator = { version = "=0.10.6", default-features = false }
