name: virt

# Build the Rust staticlibs, link them into Symbian EXEs with NeoSymbian/build, boot the ROM's user side on QEMU virt
# with our AArch64 kernel, run the EXEs through fshell and check their exit statuses and output.
on:
  push:
    branches: [main]     # a PR branch runs once, as its pull_request
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  # nightly against build's and the kernel's main heads: a change there that breaks these EXEs shows up within a day
  schedule:
    - cron: '45 3 * * *'

# a newer push to the same PR cancels its older run; main keeps one result per commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  virt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: e32-rs

      - uses: actions/checkout@v4
        with:
          repository: NeoSymbian/build
          path: build

      # also the QEMU virt test driver (baseport/arm64/tools/test-fshell-qemu.py), from the same kernel main
      - name: Kernel exec table (execs.txt)
        run: |
          git init -q kernelhwsrv
          git -C kernelhwsrv remote add origin https://github.com/NeoSymbian/kernel.git
          git -C kernelhwsrv fetch -q --depth 1 --filter=blob:none origin main
          git -C kernelhwsrv sparse-checkout set kernel/eka/kernel baseport/arm64/tools
          git -C kernelhwsrv checkout -q FETCH_HEAD

      - name: Generated exec numbers are up to date
        working-directory: e32-rs
        run: |
          python3 tools/gen_execs.py ../kernelhwsrv/kernel/eka/kernel/execs.txt
          git diff --exit-code crates/e32-sys/src/execs.rs

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        working-directory: e32-rs
        run: rustup toolchain install   # reads rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e32-rs -> target

      - name: Rust
        working-directory: e32-rs
        run: |
          cargo fmt --check
          cargo clippy -p e32-sys -p e32 -p neoecho -- -D warnings
          cargo clippy-arm --workspace -- -D warnings
          cargo test -p e32-sys -p e32
          cargo arm
          mkdir -p ../build/rust
          cp target/armv8a-neosymbian-eabi/release/{librust_hello,libneor1,libneopanic,libneotest,libneosrv,libneowb1,libneocpu}.a ../build/rust/  # neowb1, neocpu: their tests need the AArch64 kernel, so they run on virt only
          cp symbian/exes.txt symbian/neocli.cpp symbian/neotrap.cpp ../build/rust/

      - name: Fetch the Symbian sources
        working-directory: build
        run: ./fetch.sh

      # the 2010 user side already built for this build commit (build CI publishes it on main), else the full build
      - name: Prebuilt base (ghcr.io/neosymbian/userside-base:<build commit>)
        working-directory: build
        run: |
          t=ghcr.io/neosymbian/userside-base:$(git rev-parse HEAD)
          if docker pull -q "$t"; then docker run --rm -v neosymbian-build:/build "$t" cp -a /base/. /build/
          else echo "no prebuilt base for build $(git rev-parse --short HEAD): the full build"; fi

      - name: Build the ROM with the Rust EXEs
        working-directory: build
        run: ./build.sh

      # the ROM's user side on our AArch64 kernel, QEMU virt with 4 Cortex-A55 (docs user-side-smp.md US6a): the kernel
      # the phone runs, SMP, ARMv8. Not Syborg: its 2010 kernel can't run the ARMv8 user side (VFP, user-side thread
      # data). This ROM has no SYSSTART, so its console is eshell, where the driver starts fshell
      - name: The AArch64 kernel for QEMU virt, with this user side
        working-directory: build
        run: KERNEL=src/oss.FCL.sf.os.kernelhwsrv ./neo kernel qemu

      - name: On virt, run neohello, neor1, neopanic, neotest, neor1c (pushed to C:), neocli, neowb1, neotrap, neocpu through fshell
        working-directory: build
        shell: bash
        run: |
          set -o pipefail
          . ./images.sh
          K=$PWD/src/oss.FCL.sf.os.kernelhwsrv
          docker run --rm --user "$(id -u):$(id -g)" -v "$K:/kernel" -v "$PWD/../kernelhwsrv/baseport/arm64/tools:/tools:ro" \
            -v neosymbian-build:/vol:ro -e OUT=/kernel/out/ekern-qemu "$BUILD_IMAGE" python3 /tools/test-fshell-qemu.py 900 \
            --cdrive /vol --run neohello --run neor1 --run neopanic --run neotest --run neor1c --run neocli --run neowb1 --run neotrap --run neocpu |
            tee out/virt.log
          cp "$K/out/ekern-qemu/serial.log" out/virt-serial.log

      - name: Check the virt output
        working-directory: build
        run: |
          v=out/virt.log s=out/virt-serial.log
          grep -q '^test-fshell-qemu: PASS$' $v
          grep -q 'pushed C:\\Sys\\Bin\\NEOR1C.EXE' $v
          grep -q '^test-fshell-qemu: run neohello -> 0$' $v
          grep -q '^test-fshell-qemu: run neor1 -> 42$' $v
          grep -q '^test-fshell-qemu: run neor1c -> 42$' $v
          grep -q '^test-fshell-qemu: run neotest -> 0$' $v
          grep -q '^test-fshell-qemu: run neocli -> 0$' $v
          grep -q '^test-fshell-qemu: run neowb1 -> 0$' $v
          grep -q '^test-fshell-qemu: run neotrap -> 0$' $v
          grep -a 'neo: rust_hello(6, 7) = 42' $s
          grep -a 'r1: 6 \* 7 = 42' $s
          grep -a 'rust panic: deliberate panic 7' $s
          grep -a 'Thread NEOPANIC.EXE.* Panic RUST' $s
          grep -a 'neotest: 13 passed, 0 failed' $s
          grep -aF 'test atomics ... ok' $s   # US4: native ARMv8 atomics and Arc across cores
          grep -aF 'test fp_threads ... ok' $s
          grep -a 'neocli: 10 passed, 0 failed' $s
          grep -a 'neocli: server exited Kill 0' $s
          grep -a 'neowb1: 6 passed, 0 failed' $s
          # US2: a TRAP keeps d8-d15 across a leave (NeoTrapFp); virt only: the Syborg kernel has no VFP support
          grep -a 'neotrap: 4 passed, 0 failed' $s
          # US6a: the AArch32 CRC32/AES/SHA instructions give the known answers on each of the 4 CPUs
          grep -q '^test-fshell-qemu: run neocpu -> 0$' $v
          grep -a 'neocpu: 4 cpus, 16 passed, 0 failed' $s
          # each CPU's line comes from that CPU (the console prefixes every line with the CPU that wrote it): the pin held
          [ "$(grep -acE '^([0-9]):cpu \1: crc32 ok aes ok sha1 ok sha256 ok' $s)" = 4 ]
          ! grep -aq 'K::Fault\|Kern::Fault' $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virt
          path: |
            build/out/log/
            build/out/virt.log
            build/out/virt-serial.log
