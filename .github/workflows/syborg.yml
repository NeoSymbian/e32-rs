name: syborg

# Build the Rust staticlibs, link them into Symbian EXEs with NeoSymbian/build, boot the 2010 ROM on QEMU
# Syborg, run the EXEs from ESHELL and check their output in the serial log.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syborg:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: e32-rs

      - uses: actions/checkout@v4
        with:
          repository: NeoSymbian/build
          path: symbian-2010

      - name: Kernel exec table (execs.txt)
        run: |
          git init -q kernelhwsrv
          git -C kernelhwsrv remote add origin https://github.com/NeoSymbian/kernel.git
          git -C kernelhwsrv fetch -q --depth 1 --filter=blob:none origin main
          git -C kernelhwsrv sparse-checkout set kernel/eka/kernel
          git -C kernelhwsrv checkout -q FETCH_HEAD

      - name: Generated exec numbers are up to date
        working-directory: e32-rs
        run: |
          python3 tools/gen_execs.py ../kernelhwsrv/kernel/eka/kernel/execs.txt
          git diff --exit-code crates/e32-sys/src/execs.rs

      - name: Rust (toolchain pinned by rust-toolchain.toml)
        working-directory: e32-rs
        run: |
          rustup toolchain install   # reads rust-toolchain.toml
          cargo fmt --check
          cargo clippy -p e32-sys -p e32 -p neoecho -- -D warnings
          cargo test -p e32-sys -p e32
          cargo arm
          mkdir -p ../symbian-2010/rust
          cp target/armv5te-none-eabi/release/{librust_hello,libneor1,libneopanic,libneotest,libneosrv}.a ../symbian-2010/rust/
          cp symbian/exes.txt symbian/neocli.cpp ../symbian-2010/rust/

      - name: Fetch the Symbian sources
        working-directory: symbian-2010
        run: ./fetch.sh

      - name: Build the ROM with the Rust EXEs
        working-directory: symbian-2010
        run: ./build.sh

      - name: Boot and run neohello, neor1, neopanic, neotest, neor1c (from C:), neocli (starts neosrv)
        working-directory: symbian-2010
        run: RUN=neohello,neor1,neopanic,neotest,neor1c,neocli SECS=220 ./boot.sh

      - name: Check the output
        working-directory: symbian-2010
        run: |
          s=out/serial.log
          # R0: C++ E32Main calling Rust
          grep -a 'neo: start' $s
          grep -a 'hello from Rust' $s
          grep -a 'neo: rust_hello(6, 7) = 42' $s
          # R1: Rust only -- exec calls, exit code, panic
          grep -a 'r1: hello from pure Rust' $s
          grep -a 'r1: 6 \* 7 = 42' $s
          grep -a "\[EKERN\] exit 'NEOR1.EXE.*reason=0x0000002a" $s
          grep -a 'rust panic: deliberate panic 7' $s
          grep -a "\[EKERN\] panic in 'NEOPANIC.EXE.*category='RUST'" $s
          # R2: heap, timers, async, threads, locks, file-server IPC; an EXE loaded from C:
          for t in alloc timer async threads semaphore fs; do grep -a "test $t ... ok" $s; done
          ! grep -aq "\[EKERN\] exit 'NEOTEST.EXE\[[0-9a-f]*\]0001::Main'" $s
          grep -a "\[EKERN\] exit 'NEOR1C.EXE.*reason=0x0000002a" $s
          # R3: a Rust IPC server -- in-process with a Rust client, and as NEOSRV.EXE with the C++ client NEOCLI.EXE
          grep -a 'test ipc_server ... ok' $s
          grep -a 'test fs_dirs ... ok' $s
          grep -a 'neotest: 8 passed, 0 failed' $s
          grep -a 'neocli: 9 passed, 0 failed' $s
          grep -a 'neosrv: done' $s
          grep -a 'neocli: server exited Kill 0' $s
          ! grep -aq "\[EKERN\] \(exit\|panic in\) 'NEOSRV\|\[EKERN\] \(exit\|panic in\) 'NEOCLI" $s
          ! grep -aq 'K::Fault\|Kern::Fault' $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syborg
          path: |
            symbian-2010/out/fb.png
            symbian-2010/out/serial.log
            symbian-2010/out/log/
            symbian-2010/out/qemu-monitor.log
