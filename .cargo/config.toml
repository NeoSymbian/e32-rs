# The Symbian user side is built -march=armv5te, ARM/Thumb, soft-float ABI (symbian-2010 toolchain/symcc).
# Never use an eabihf target: it passes floats in VFP registers and breaks calls into Symbian libraries.
[build]
target = "armv5te-none-eabi"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
